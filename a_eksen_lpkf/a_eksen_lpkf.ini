[TASK]
TASK = milltask
CYCLE_TIME = 0.001
#0.001  nereye geldik??:)
#Bu süre zarfında G-kodu satırları çözümlenir,1msaniye
#MDI komutları işlenir ve motion (hareket) katmanına komutlar gönderilir.
[RS274NGC]

# G-code yorumlayıcı ayarları
#RS274NGC_STARTUP_CODE = G17 G21 G40 G54 G80 G90 G94 G97 M5 M9
#RS274NGC_STARTUP_CODE = G21 G40 G90 G94 G97 G64 P0.025
#RS274NGC_STARTUP_CODE = G21 G17  G40 G54 G80 G90 G94 G97 G64 P0.025 M5 M9
RS274NGC_STARTUP_CODE = G21 G17  G40 G54 G80 G90 G94 G97  M5 M9 
#G21: Metrik (Türkiye'de standart)
#		X-Y düzlemini seç
#		(dairesel interpolasyon için).
#		- G17 = X-Y düzlemi
#		- G18 = X-Z
#		- G19 = Y-Z
#G40: Güvenli başlangıç
#		Takım yarıçap kompanzasyonu kapalı
#		- G41 = Sol tarafta kompanzasyon
#		- G42 = Sağ tarafta kompanzasyon
#		- G40 = Kapalı (güvenli başlangıç)
#G54: İş parçası sıfırı
#G80: Döngü yok
#G90: Mutlak koordinat
#G94: mm/dakika
#G97: RPM modu	
#Sabit devir sayısı (sabit RPM)
#- G96 = Sabit kesme hızı (torna için, CNC torna)
#G64 P0.025: Hızlı ve düzgün hareket
#M5 M9: Spindle ve soğutma kapalı




PARAMETER_FILE = linuxcnc.var

 
SUBROUTINE_PATH = macros


REMAP=M600  modalgroup=6 ngc=master-caki-olcme
